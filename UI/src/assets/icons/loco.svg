<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 62 34" width="62" height="34">
  <defs>
    <linearGradient id="locoBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cabGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="windowGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Chassis / Underframe -->
  <rect x="2" y="22" width="58" height="6" rx="2" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
  
  <!-- Bogies / Wheels -->
  <circle cx="10" cy="28" r="4.5" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="10" cy="28" r="2" fill="#0f172a"/>
  <circle cx="20" cy="28" r="4.5" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="20" cy="28" r="2" fill="#0f172a"/>
  
  <circle cx="44" cy="28" r="4.5" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="44" cy="28" r="2" fill="#0f172a"/>
  <circle cx="54" cy="28" r="4.5" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <circle cx="54" cy="28" r="2" fill="#0f172a"/>

  <!-- Main Hood / Engine Body -->
  <path d="M4 22 L4 10 Q4 8 7 8 L32 8 L32 22 Z" fill="url(#locoBody)" stroke="#0f172a" stroke-width="0.8"/>
  
  <!-- Cooling Vents & Stripes on Hood -->
  <line x1="8" y1="11" x2="8" y2="19" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="12" y1="11" x2="12" y2="19" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="11" x2="16" y2="19" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="11" x2="20" y2="19" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="24" y1="11" x2="24" y2="19" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>

  <!-- High-Vis Warning Stripes -->
  <path d="M4 19 L10 13 L12 13 L6 19 Z" fill="#fbbf24"/>
  <path d="M14 19 L20 13 L22 13 L16 19 Z" fill="#fbbf24"/>

  <!-- Operator Cabin -->
  <path d="M32 22 L32 5 Q32 3 35 3 L54 3 Q58 3 58 7 L58 22 Z" fill="url(#cabGrad)" stroke="#0f172a" stroke-width="0.8"/>
  
  <!-- Cabin Roof Visor -->
  <path d="M30 3 L60 3 Q61 3 61 5 L59 5 L31 5 Z" fill="#0284c7"/>

  <!-- Cabin Windows -->
  <rect x="35" y="6" width="9" height="7" rx="1" fill="url(#windowGrad)" stroke="#0c4a6e" stroke-width="0.7"/>
  <rect x="46" y="6" width="10" height="7" rx="1" fill="url(#windowGrad)" stroke="#0c4a6e" stroke-width="0.7"/>

  <!-- Front Nose / Headlight -->
  <path d="M58 12 L61 14 L61 20 L58 22 Z" fill="#f59e0b"/>
  <circle cx="60.5" cy="16.5" r="2" fill="#fff" filter="url(#shadow)"/>
  <circle cx="60.5" cy="16.5" r="1.2" fill="#fef08a"/>

  <!-- Coupler (Rear and Front) -->
  <rect x="0" y="23" width="3" height="3" rx="0.5" fill="#64748b"/>
  <rect x="60" y="23" width="2" height="3" rx="0.5" fill="#64748b"/>

  <!-- Exhaust stack -->
  <rect x="10" y="5" width="4" height="3" rx="0.5" fill="#1e293b"/>
</svg>
