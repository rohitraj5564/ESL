<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 34" width="26" height="34">
  <defs>
    <linearGradient id="emptyLadleShell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="emptyInterior" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- Rail Car Flatbed Underframe -->
  <rect x="1" y="24" width="24" height="4" rx="1" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
  <circle cx="6" cy="28" r="3.2" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="6" cy="28" r="1.3" fill="#0f172a"/>
  <circle cx="20" cy="28" r="3.2" fill="#334155" stroke="#64748b" stroke-width="1.2"/>
  <circle cx="20" cy="28" r="1.3" fill="#0f172a"/>
  <!-- Coupler bar -->
  <rect x="0" y="25" width="2" height="2" rx="0.5" fill="#64748b"/>
  <rect x="24" y="25" width="2" height="2" rx="0.5" fill="#64748b"/>

  <!-- Ladle Cradle / Trunnion Supports -->
  <path d="M4 24 L7 16 L10 24 Z" fill="#1e293b"/>
  <path d="M22 24 L19 16 L16 24 Z" fill="#1e293b"/>

  <!-- Torpedo/Bucket Ladle Outer Shell -->
  <path d="M4 14 Q3 22 13 23 Q23 22 22 14 Q22 9 13 9 Q4 9 4 14 Z" fill="url(#emptyLadleShell)" stroke="#0f172a" stroke-width="0.9"/>
  
  <!-- Ladle Trunnions (Pivot pins) -->
  <circle cx="3" cy="14" r="1.5" fill="#94a3b8" stroke="#0f172a" stroke-width="0.6"/>
  <circle cx="23" cy="14" r="1.5" fill="#94a3b8" stroke="#0f172a" stroke-width="0.6"/>

  <!-- Top Rim / Opening of Ladle -->
  <ellipse cx="13" cy="10" rx="8" ry="3.5" fill="#334155" stroke="#475569" stroke-width="0.8"/>
  
  <!-- Empty dark refractory cavity -->
  <ellipse cx="13" cy="10" rx="6.8" ry="2.6" fill="url(#emptyInterior)"/>
</svg>
