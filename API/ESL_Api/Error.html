<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error - Request Could Not Be Processed</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 2.5rem;
            border-radius: 12px;
            text-align: center;
            max-width: 480px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.75rem; margin-bottom: 1rem; color: #f43f5e; }
        p { color: #94a3b8; font-size: 1rem; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="card">
        <h1>An Error Occurred</h1>
        <p>The requested operation could not be completed. Detailed error information has been suppressed for security reasons.</p>
    </div>
</body>
</html>
